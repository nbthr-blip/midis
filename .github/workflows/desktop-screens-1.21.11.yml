name: Desktop Screens — Fabric 1.21.11 experimental build

on:
  push:
    branches: ["experiments/desktop-screens-1.21.11"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout port bootstrap
        uses: actions/checkout@v4
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Clone original MIT-licensed source
        run: |
          git clone https://github.com/MagiMigi/desktop-screens.git upstream
          git -C upstream checkout 31e64620c60db522a9032c3b2ebc5baf43f71247
      - name: Apply Minecraft 1.21.11 + StreamCraft hotkey patch
        run: python3 scripts/desktop_screens_patch.py upstream
      - name: Apply integrated host patches
        run: |
          python3 scripts/host_broadcast_patch.py upstream
          python3 scripts/host_broadcast_stage3.py upstream
      - name: Apply V4 patches
        run: |
          python3 scripts/v4_patch.py upstream
          python3 scripts/v4_tablet_ui_patch.py upstream
          python3 scripts/v5_patch.py upstream
      - name: Compile Fabric mod
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :1.21.11-fabric:build --no-daemon --stacktrace --console=plain
      - name: Upload compiled mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DesktopScreens_Fabric_1.21.11_V5
          path: upstream/versions/1.21.11-fabric/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Smoke test client launch under virtual display
        if: success()
        timeout-minutes: 6
        working-directory: upstream
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri >/dev/null
          set +e
          env LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout 150s ./gradlew :1.21.11-fabric:runClient --no-daemon --console=plain > client-smoke.log 2>&1
          result=$?
          set -e
          tail -n 100 client-smoke.log
          if grep -E 'MixinApplyError|InvalidInjectionException|Minecraft has crashed|Exception in thread "main"|NoClassDefFoundError' client-smoke.log; then
            echo "::error::Minecraft client startup crashed"
            exit 1
          fi
          if [ "$result" -ne 0 ] && [ "$result" -ne 124 ]; then
            echo "::error::Client run exited with status $result"
            exit "$result"
          fi
          echo "Client smoke test did not detect immediate Java startup errors; timeout is expected for a running game."
