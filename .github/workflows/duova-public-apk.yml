name: Duova virtual APK
on:
  push:
    branches: [duova-v4-manager-launch]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout customizations
        uses: actions/checkout@v4
      - name: Checkout virtualization engine
        uses: actions/checkout@v4
        with:
          repository: fdavids77/BlackBoxReborn
          ref: 7b86a9d62a974650e0659825758931cd91140827
          path: virtualizer
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install patch dependency
        run: python -m pip install Pillow
      - name: Apply Duova visual design
        run: |
          python - <<'PY'
          from pathlib import Path
          import zlib,base64
          encoded=Path('duova/duova_brand_patch.zlib.b64').read_text().strip()
          try:
              patch=zlib.decompress(base64.b64decode(encoded))
          except Exception:
              # Repair a one-character copy loss in the encoded patch.
              alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
              patch=None
              for i in range(len(encoded)+1):
                  for char in alphabet:
                      try:
                          candidate=encoded[:i]+char+encoded[i:]
                          patch=zlib.decompress(base64.b64decode(candidate))
                          print('Recovered transfer at',i)
                          break
                      except Exception:
                          pass
                  if patch is not None: break
              if patch is None: raise RuntimeError('Encoded patch was not recoverable')
          Path('virtualizer/duova_patch.py').write_bytes(patch)
          PY
          cd virtualizer
          python duova_patch.py
          sed -i 's/android:allowBackup="false"/android:allowBackup="false" tools:replace="android:allowBackup"/' app/src/main/AndroidManifest.xml
          sed -i 's/name="colorBackground"/name="android:colorBackground"/' app/src/main/res/values/themes.xml
          sed -i 's#</menu>#<item android:id="@+id/main_tg" android:title="Communauté" android:visible="false" />\n</menu>#' app/src/main/res/menu/menu_main.xml
      - name: Minimize sensitive permissions
        run: |
          cd virtualizer
          python ../duova/secure_manifest.py
      - name: Update Android target SDK for installation compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('virtualizer/build.gradle')
          t=p.read_text()
          import re
          t,n=re.subn(r'targetSdkVersion\s*=\s*28', 'targetSdkVersion = 35',t)
          assert n==1, 'Unexpected target SDK configuration'
          p.write_text(t)
          print('Target SDK updated to 35; functional runtime compatibility is unverified.')
          PY
      - name: Fix app picker and home UI
        run: |
          python - <<'PY'
          import base64, zlib, pathlib
          p=pathlib.Path("duova/duova_v3_fix.zlib.b64")
          target=pathlib.Path("virtualizer/duova_v3_fix.py")
          target.write_bytes(zlib.decompress(base64.b64decode(p.read_text().strip())))
          PY
          cd virtualizer
          python duova_v3_fix.py
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/res/layout/activity_list.xml')
          x=p.read_text()
          extra='''<FrameLayout android:id="@+id/stateView" android:layout_width="0dp" android:layout_height="0dp" android:visibility="gone"/>
          <com.ferfalk.simplesearchview.SimpleSearchView android:id="@+id/searchView" android:layout_width="0dp" android:layout_height="0dp" android:visibility="gone"/>'''
          i=x.rfind('</LinearLayout>')
          assert i>=0
          x=x[:i]+extra+x[i:]
          p.write_text(x)
          PY
      - name: Install Duova V4 clone management
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('virtualizer')
          dst=root/'app/src/main/java/top/niunaijun/blackboxa/view/main/ManageAppsActivity.kt'
          shutil.copyfile('duova/v4/ManageAppsActivity.kt', dst)
          manifest=root/'app/src/main/AndroidManifest.xml'
          t=manifest.read_text()
          t=t.replace('</application>','<activity android:name=".view.main.ManageAppsActivity" android:exported="false"/></application>')
          manifest.write_text(t)
          menu=root/'app/src/main/res/menu/menu_main.xml'
          t=menu.read_text()
          t=t.replace('</menu>','<item android:id="@+id/manage_clones" android:title="Mes clones" app:showAsAction="never"/></menu>')
          menu.write_text(t)
          activity=root/'app/src/main/java/top/niunaijun/blackboxa/view/main/MainActivity.kt'
          t=activity.read_text()
          t=t.replace('when (item.itemId) {','when (item.itemId) {\n                R.id.manage_clones -> {\n                    val intent = Intent(this, ManageAppsActivity::class.java)\n                    intent.putExtra("userID", currentUser)\n                    startActivity(intent)\n                }')
          activity.write_text(t)
          PY
      - name: Install clone manager and virtual launch diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('virtualizer')
          source=Path('duova/v4/ManageAppsActivity.kt').read_text()
          source=source.replace('"${apps.size} application(s) dans cet espace"', 'apps.size.toString() + " application(s) dans cet espace"')
          dest=root/'app/src/main/java/top/niunaijun/blackboxa/view/main/ManageAppsActivity.kt'
          dest.write_text(source)
          manifest=root/'app/src/main/AndroidManifest.xml'
          m=manifest.read_text().replace('</application>', '<activity android:name=".view.main.ManageAppsActivity" android:exported="false" /></application>')
          manifest.write_text(m)
          menu=root/'app/src/main/res/menu/menu_main.xml'
          x=menu.read_text().replace('</menu>', '<item android:id="@+id/manage_clones" android:title="Gérer mes clones" app:showAsAction="never" /></menu>')
          menu.write_text(x)
          main=root/'app/src/main/java/top/niunaijun/blackboxa/view/main/MainActivity.kt'
          x=main.read_text().replace('R.id.main_setting -> {', '''R.id.manage_clones -> {
                    val i = Intent(this, ManageAppsActivity::class.java)
                    i.putExtra("userID", currentUser)
                    startActivity(i)
                }
                R.id.main_setting -> {''')
          main.write_text(x)
          PY
      - name: Build Android APK
        working-directory: virtualizer
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="$(find virtualizer/app/build/outputs/apk/debug -name '*arm64-v8a*.apk' | head -1)"
          test -n "$FILE"
          gh release delete duova-v4-manager-launch -y || true
          gh release create duova-v4-manager-launch "$FILE#Duova-v4-manager-ARM64.apk" --title "Duova V4 beta - Clone manager and launch diagnostics" --notes "Experimental Android virtual app container. No ads added, reduced sensitive permissions; not security audited; functions may not work on Android 16. Apps and Android 16 compatibility unverified. Based on BlackBoxReborn (Apache-2.0)." --target duova-v4-manager-launch --prerelease
